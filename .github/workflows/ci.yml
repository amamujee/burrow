name: CI

on:
  push:
    branches:
      - main
      - codex/ci-save-diagnostics
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome webkit

      - name: Verify app
        run: |
          npm run build
          node scripts/run-playwright.mjs --watchdog-idle-ms=60000 --watchdog-max-ms=300000 --project=webkit --workers=1 --repeat-each=6 --trace=retain-on-failure --grep 'saving offline includes maps before'

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-map-failure
          path: test-results
